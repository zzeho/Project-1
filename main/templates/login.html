<!DOCTYPE html>
<head>
    <title>Log in</title>
</head>
<body>
    <h1>Log in</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

{% if not locked %}
    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required><br><br>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required><br><br>

        <button type="submit">Log in</button>
    </form>
{% endif %}

    <p>
        <a href="{% url 'signup' %}">Sign up</a>
    </p>
</body>
</html>
